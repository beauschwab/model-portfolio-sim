name: Storage operations
on:
  pull_request:
    paths: ['apps/api/**', 'packages/portfolio-ledger-native/**', 'packages/portfolio-risk-native/**', 'packages/portfolio-model-core/**', 'packages/portfolio-compute-control/**', 'packages/portfolio-decision-native/**', '.github/workflows/storage-operations.yml']
  push:
    paths: ['apps/api/**', 'packages/portfolio-ledger-native/**', 'packages/portfolio-risk-native/**', 'packages/portfolio-model-core/**', 'packages/portfolio-compute-control/**', 'packages/portfolio-decision-native/**', '.github/workflows/storage-operations.yml']
permissions:
  contents: read
jobs:
  storage:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: workbench_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql+psycopg://postgres:test-only@127.0.0.1:5432/workbench_test
      NUMBA_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: uv sync --project apps/api --extra dev --extra iceberg --python 3.12
      - run: uv run --project apps/api --extra iceberg python scripts/build_ledger_native.py
      - run: uv run --project apps/api python scripts/build_native.py
      - run: uv run --project apps/api --with libclang --with cmake python scripts/build_decision_native.py
      - run: uv run --extra dev --extra iceberg python -m pytest tests/test_operations.py tests/test_streamed_jobs.py -q
        working-directory: apps/api
