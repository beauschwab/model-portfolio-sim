name: Architecture and interface contracts
on:
  workflow_call:
  push:
    paths: ['AGENTS.md', 'docs/changelog/**', 'docs/reviews/issue-67-agent-contract.md', 'apps/**', 'packages/**', 'scripts/**', 'docs/contracts/**', 'Makefile', 'package.json', '.github/workflows/architecture.yml']
  pull_request:
    paths: ['AGENTS.md', 'docs/changelog/**', 'docs/reviews/issue-67-agent-contract.md', 'apps/**', 'packages/**', 'scripts/**', 'docs/contracts/**', 'Makefile', 'package.json', '.github/workflows/architecture.yml']
permissions:
  contents: read
jobs:
  boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/check_agent_contract.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: bun install --frozen-lockfile
      - run: uv sync --project apps/api --extra dev --locked
      - run: make check-architecture
      - run: bun run --cwd apps/web build
