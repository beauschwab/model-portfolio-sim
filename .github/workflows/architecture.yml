name: Architecture and interface contracts
on:
  push:
    paths: ['apps/**', 'packages/**', 'scripts/**', 'docs/contracts/**', 'Makefile', 'package.json', '.github/workflows/architecture.yml']
  pull_request:
    paths: ['apps/**', 'packages/**', 'scripts/**', 'docs/contracts/**', 'Makefile', 'package.json', '.github/workflows/architecture.yml']
permissions:
  contents: read
jobs:
  boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: bun install --frozen-lockfile
      - run: uv sync --project apps/api --extra dev --locked
      - run: uv run --project apps/api python scripts/check_architecture.py
      - run: uv run --project apps/api python -m unittest discover -s scripts/tests -v
      - run: uv run --project apps/api python scripts/generate_native_contracts.py --check
      - run: uv run --project apps/api python scripts/generate_http_contracts.py --check
      - run: bun run --cwd apps/web build
