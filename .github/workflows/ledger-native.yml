name: Ledger native pilot

on:
  push:
    paths:
      - 'packages/portfolio-ledger-native/**'
      - 'packages/portfolio-model-core/**'
      - 'packages/portfolio-compute-control/**'
      - 'packages/portfolio-risk/**'
      - 'scripts/build_ledger_native.py'
      - '.github/workflows/ledger-native.yml'
  pull_request:
    paths:
      - 'packages/portfolio-ledger-native/**'
      - 'packages/portfolio-model-core/**'
      - 'packages/portfolio-compute-control/**'
      - 'packages/portfolio-risk/**'
      - 'scripts/build_ledger_native.py'
      - '.github/workflows/ledger-native.yml'

permissions:
  contents: read

jobs:
  parity:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: dtolnay/rust-toolchain@1.93.1
        with:
          components: rustfmt, clippy
      - run: uv sync --project packages/portfolio-risk --extra dev --python 3.12
      - run: cargo fmt --manifest-path packages/portfolio-ledger-native/Cargo.toml -- --check
      - run: cargo clippy --locked --manifest-path packages/portfolio-ledger-native/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path packages/portfolio-ledger-native/Cargo.toml
      - run: uv run --project packages/portfolio-risk python scripts/build_ledger_native.py
      - run: uv run --project packages/portfolio-risk python scripts/build_native.py
      - run: uv run --project packages/portfolio-risk --with libclang --with cmake python scripts/build_decision_native.py
      - run: uv run --project packages/portfolio-risk python -m pytest packages/portfolio-risk/tests/test_ledger_native.py packages/portfolio-risk/tests/test_balance_stream.py packages/portfolio-risk/tests/test_balance_ledger.py packages/portfolio-risk/tests/test_balance_stress.py packages/portfolio-risk/tests/test_security_basis.py -q
