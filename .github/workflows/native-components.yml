name: Native component tests
on:
  pull_request:
    paths: ['packages/portfolio-model-core/**', 'packages/portfolio-compute-control/**', 'packages/portfolio-ledger-native/**', 'packages/portfolio-risk-native/**', 'packages/portfolio-decision-native/**', 'packages/portfolio-verification-native/**', 'scripts/check_native_components.py', '.github/workflows/native-components.yml']
  push:
    branches: [main]
    paths: ['packages/portfolio-model-core/**', 'packages/portfolio-compute-control/**', 'packages/portfolio-ledger-native/**', 'packages/portfolio-risk-native/**', 'packages/portfolio-decision-native/**', 'packages/portfolio-verification-native/**', 'scripts/check_native_components.py', '.github/workflows/native-components.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  components:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@1.93.1
        with:
          components: rustfmt, clippy
      - run: uv run --no-project --with libclang --with cmake python scripts/check_native_components.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-components-${{ matrix.os }}
          path: artifacts/native-components
          if-no-files-found: error
