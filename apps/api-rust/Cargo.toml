[package]
name = "workbench-native"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Rust workbench service: HTTP admission, durable leased worker and verified storage publication"

[dependencies]
portfolio-verification-native = { path = "../../packages/portfolio-verification-native" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["float_roundtrip"] }
sha2 = "=0.10.9"
rusqlite = { version = "0.37", features = ["bundled"] }
postgres = { version = "0.19", features = ["with-serde_json-1"] }
tiny_http = "0.12"
uuid = { version = "1", features = ["v4"] }
object_store = { version = "0.12", default-features = false, features = ["aws"], optional = true }
tokio = { version = "1", default-features = false, features = ["rt"], optional = true }
bytes = { version = "1", optional = true }

[features]
default = []
s3 = ["dep:object_store", "dep:tokio", "dep:bytes"]
# Test-only fault points (stalled heartbeat, delayed final I/O). Never enabled in release builds.
fault-injection = []

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[[test]]
name = "fencing"
required-features = ["fault-injection"]

[[test]]
name = "s3"
required-features = ["s3"]
