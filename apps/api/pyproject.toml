[project]
name = "rates-api"
version = "0.2.0"
description = "FastAPI service over the portfolio-risk engine"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "portfolio-risk",
  "httpx>=0.27",
  "openpyxl>=3.1,<4",
  "sqlalchemy>=2.0.36,<2.1",
  "psycopg[binary]>=3.2,<4",
  "boto3>=1.35,<2",
  "duckdb>=1.1,<2",
]

[tool.uv.sources]
portfolio-risk = { path = "../../packages/portfolio-risk", editable = true }

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
iceberg = [
    "pyiceberg[pyarrow,sql-sqlite]>=0.10,<0.11",
]
