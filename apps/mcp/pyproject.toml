[project]
name = "rates-workbench-mcp"
version = "0.2.0"
description = "MCP transport for the Rates Workbench HTTP API"
requires-python = ">=3.11"
dependencies = ["mcp>=1.26,<2", "httpx>=0.28,<1", "jsonschema>=4.23,<5", "pyarrow>=19,<24"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.25"]

[project.scripts]
rates-workbench-mcp = "workbench_mcp.server:main"
rates-workbench-ops = "workbench_mcp.server:ops_main"
rates-workbench-strategy = "workbench_mcp.server:strategy_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/workbench_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
