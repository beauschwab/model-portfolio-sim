[package]
name = "portfolio-ledger-native"
version = "0.1.0"
edition = "2021"
autobins = false
license = "MIT"
description = "Batched transactional ledger reduction pilot"

[[bin]]
name = "portfolio-balance"
path = "src/bin/balance.rs"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
portfolio-compute-control = { path = "../portfolio-compute-control" }
serde = { version = "=1.0.228", features = ["derive", "rc"] }
serde_json = { version = "=1.0.151", features = ["float_roundtrip"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
