[package]
name = "portfolio-risk-native"
version = "0.1.0"
edition = "2021"
license = "MIT AND BSD-3-Clause"
description = "Optional validated CSR discount kernel for rates-workbench"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
compute-profile = []
allocator-mimalloc = ["dep:mimalloc"]

[dependencies]
portfolio-model-core = { path = "../portfolio-model-core" }
portfolio-compute-control = { path = "../portfolio-compute-control" }
rayon = "=1.11.0"
nalgebra = { version = "=0.34.2", default-features = false, features = ["std"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.151"
mimalloc = { version = "=0.1.52", optional = true }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
