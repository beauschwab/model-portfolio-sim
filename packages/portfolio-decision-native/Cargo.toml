[package]
name = "portfolio-decision-native"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Transactional incremental strategy decision prototype"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
portfolio-ledger-native = { path = "../portfolio-ledger-native" }
portfolio-compute-control = { path = "../portfolio-compute-control" }
portfolio-risk-native = { path = "../portfolio-risk-native" }
highs = "=2.4.0"
highs-sys = "=1.15.0"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.151"

[profile.release]
opt-level = 3
lto = "thin"
