[package]
name = "portfolio-decision-native"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Native strategy coordination, HiGHS allocation and verified daily workflow"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
portfolio-model-core = { path = "../portfolio-model-core" }
portfolio-ledger-native = { path = "../portfolio-ledger-native" }
portfolio-compute-control = { path = "../portfolio-compute-control" }
portfolio-risk-native = { path = "../portfolio-risk-native" }
highs = "=2.4.0"
highs-sys = "=1.15.0"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["float_roundtrip", "raw_value"] }

sha2 = "=0.10.9"

[dev-dependencies]
portfolio-verification-native = { path = "../portfolio-verification-native" }

[profile.release]
opt-level = 3
lto = "thin"

